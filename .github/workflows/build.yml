
name: Build RANDOM PSP

'on':
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "Makefile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify files
        shell: sh
        run: |
          set -eu

          echo "Checking project files"

          for file in \
            src/main.c \
            src/graphics.h \
            src/graphics.c \
            src/menu.h \
            src/menu.c \
            src/game.h \
            src/game.c \
            src/sprite.h \
            src/sprite.c \
            src/character.h \
            src/character.c \
            Makefile
          do
            if [ ! -f "$file" ]; then
              echo "MISSING FILE: $file"
              exit 1
            fi
          done

          echo "All required files exist."

      - name: Clean
        run: make clean

      - name: Compile RANDOM
        run: make

      - name: Verify EBOOT
        shell: sh
        run: |
          set -eu

          test -s EBOOT.PBP

          echo "EBOOT size:"
          ls -lh EBOOT.PBP

          echo "PBP signature:"
          od -An -tx1 -N4 EBOOT.PBP

          echo "PBP section offsets:"
          od -An -tu4 -j8 -N28 EBOOT.PBP

          echo "Generated executable:"
          for file in RANDOM.prx RANDOM.elf; do
            if [ -f "$file" ]; then
              ls -lh "$file"
            fi
          done

          echo "EBOOT verification completed."

      - name: Prepare PSP package
        shell: sh
        run: |
          set -eu

          mkdir -p package/PSP/GAME/RANDOM

          cp EBOOT.PBP package/PSP/GAME/RANDOM/

          if [ -d assets ]; then
            cp -r assets package/PSP/GAME/RANDOM/
          fi

          echo "Package contents:"
          find package -type f -print

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: RANDOM-PSP
          path: package/
          if-no-files-found: error
