name: Build RANDOM PSP

'on':
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "Makefile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify files
        shell: sh
        run: |
          set -eu
          for file in \
            src/main.c \
            src/graphics.h src/graphics.c \
            src/menu.h src/menu.c \
            src/game.h src/game.c \
            src/sprite.h src/sprite.c \
            src/character.h src/character.c \
            Makefile
          do
            test -f "$file" || {
              echo "Arquivo ausente: $file"
              exit 1
            }
          done

      - name: Clean
        run: make clean

      - name: Compile
        run: make

      - name: Verify EBOOT
        shell: sh
        run: |
          set -eu
          test -s EBOOT.PBP
          printf 'Assinatura PBP: '
          od -An -tx1 -N4 EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Prepare PSP package
        shell: sh
        run: |
          set -eu
          mkdir -p package/PSP/GAME/RANDOM
          cp EBOOT.PBP package/PSP/GAME/RANDOM/
          if [ -d assets ]; then
            cp -r assets package/PSP/GAME/RANDOM/
          fi
          test -s package/PSP/GAME/RANDOM/EBOOT.PBP
          find package -type f -print

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: RANDOM-PSP
          path: package/
          if-no-files-found: error

