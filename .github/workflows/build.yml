name: Build RANDOM PSP

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "Makefile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ZIP
        run: |
          apt-get update
          apt-get install -y zip

      - name: Check project files
        run: |
          test -f Makefile
          test -f src/main.c
          test -f src/character.c
          test -f src/character.h
          test -d assets/sprites

      - name: Build EBOOT
        run: |
          make clean || true
          make
          test -f EBOOT.PBP

      - name: Package game
        run: |
          mkdir -p package/PSP/GAME/RANDOM/assets/sprites
          cp EBOOT.PBP package/PSP/GAME/RANDOM/
          cp assets/sprites/*.png package/PSP/GAME/RANDOM/assets/sprites/
          cd package
          zip -r ../RANDOM-PSP.zip PSP

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: RANDOM-PSP-EBOOT
          path: EBOOT.PBP

      - name: Upload complete game
        uses: actions/upload-artifact@v4
        with:
          name: RANDOM-PSP-COMPLETO
          path: RANDOM-PSP.zip
