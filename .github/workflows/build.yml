
name: Build RANDOM PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          test -f Makefile
          test -f src/main.c
          test -f assets/sprites/idle_1.png

      - name: Compilar jogo
        run: |
          make clean
          make
          test -f EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Publicar EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: RANDOM-Beta-0.1
          path: EBOOT.PBP
          if-no-files-found: error
          retention-days: 30
