
name: Diagnostico RANDOM PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Mostrar estrutura do repositorio
        run: |
          echo "=== DIRETORIO ATUAL ==="
          pwd
          echo "=== ARQUIVOS E PASTAS ==="
          ls -la
          echo "=== ARQUIVOS DO PROJETO ==="
          find . -type f | sort | head -300
          echo "=== PROCURAR CODIGO E MAKEFILE ==="
          find . -type f \( -iname "main.c" -o -iname "Makefile" -o -iname "*.c" \)
