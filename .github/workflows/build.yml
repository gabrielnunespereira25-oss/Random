
name: Build RANDOM PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          test -f Makefile
          test -f src/main.c
          test -d assets/sprites
          echo "Codigo e sprites encontrados."

      - name: Compilar RANDOM
        run: |
          make clean
          make

      - name: Verificar EBOOT
        run: |
          if [ ! -f EBOOT.PBP ]; then
            echo "ERRO: EBOOT.PBP nao foi gerado."
            find . -maxdepth 3 -type f
            exit 1
          fi
          ls -lh EBOOT.PBP

      - name: Disponibilizar EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: RANDOM-Beta-0.1
          path: EBOOT.PBP
          if-no-files-found: error
          retention-days: 30
